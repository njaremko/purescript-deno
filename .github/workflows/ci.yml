name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.5.6"
      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "0.15.6"
          spago: "1.0.5"
      - run: spago build
      - name: Test Deno runtime bindings
        env:
          PURESCRIPT_DENO_TEST: runtime-fixture
        run: deno eval 'import { main } from "./output/Test.Main/index.js"; main()'
